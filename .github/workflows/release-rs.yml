# Rust 版 statetrail（herdr/）：推 v0.2 起的标签就编 4 个平台、发到 GitHub Release，
# herdr 装插件时 herdr/install.sh 按清单里的 version 下对应的包。推 rust 分支（改到 herdr/ 时）只编不发。
name: release-rs

on:
  push:
    tags: ["v0.2*", "v0.3*", "v0.4*", "v0.5*", "v0.6*", "v0.7*", "v0.8*", "v0.9*", "v1*"]
    # 推标签时不看 paths
    branches: [rust]
    paths: ["herdr/**", ".github/workflows/release-rs.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: macos-14, target: x86_64-apple-darwin }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: herdr
    steps:
      - uses: actions/checkout@v4
      - name: Check manifest version matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v="$(grep -m1 '^version' herdr-plugin.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          test "v$v" = "$GITHUB_REF_NAME" || { echo "herdr-plugin.toml version v$v != tag $GITHUB_REF_NAME"; exit 1; }
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo test --locked
        if: "!contains(matrix.target, 'x86_64-apple')"
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          a="statetrail-${{ matrix.target }}.tar.gz"
          tar -czf "$a" -C "target/${{ matrix.target }}/release" statetrail
          shasum -a 256 "$a" > "$a.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: statetrail-${{ matrix.target }}
          path: herdr/statetrail-${{ matrix.target }}.tar.gz*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" $pre \
            --title "statetrail $GITHUB_REF_NAME (Rust)" --notes "Rust rewrite of statetrail for herdr. Install: herdr plugin install siyuanseever/statetrail/herdr --ref $GITHUB_REF_NAME"
