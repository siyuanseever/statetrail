[package]
name = "statetrail-tmux"
version = "0.1.0"
edition = "2024"
description = "statetrail for tmux, in Rust: the trail of a Claude Code session docked next to it"
license = "MIT"
publish = false

[[bin]]
name = "statetrail-tmux"
path = "src/main.rs"

[dependencies]
statetrail-core = { path = "../core" }
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.28", default-features = false, features = ["events"] }
serde_json = "1"
toml = { version = "0.8", default-features = false, features = ["parse"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
unicode-width = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
