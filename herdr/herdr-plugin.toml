# statetrail（herdr 版）：Claude Code 会话轨迹，停在 Claude 窗格右边。0.2 起是 Rust 写的；
# Python 版（0.1.x）在 v0.1.4 标签里，herdr plugin install siyuanseever/statetrail/herdr --ref v0.1.4。
# 开发：cargo build --release && mkdir -p bin && cp target/release/statetrail bin/.new && mv bin/.new bin/statetrail，
# 再 herdr plugin link 这个目录。别直接 cp 盖掉 bin/statetrail：macOS 上原地改写的程序一跑就被系统杀掉（退出码 137），
# 开着的轨迹试跑新程序失败，就不会原地换上它
id = "statetrail"
name = "statetrail"
version = "0.2.1"
min_herdr_version = "0.9.5"
description = "Every turn of your Claude Code session, docked next to the running Claude: click one and Claude scrolls to it."
platforms = ["macos", "linux"]

# herdr plugin install 时跑：按 version 从 GitHub Release 下这个平台编好的 bin/statetrail，下不到就用 cargo 就地编。
# herdr plugin link（本地开发）不跑它。发版流程见仓库根目录 .github/workflows/release-rs.yml。
[[build]]
platforms = ["macos", "linux"]
command = ["bash", "install.sh"]

[[actions]]
id = "toggle"
title = "Toggle statetrail"
description = "Open the trail beside the focused Claude Code pane, or switch it between the wide and the narrow layout."
contexts = ["pane"]
command = ["bin/statetrail", "toggle"]

# 跳到某个 Claude：居中的浮窗，照 tmux 版 picker（prefix+g）的样子；想让 prefix+g 开它，见 README
[[actions]]
id = "goto"
title = "Go to a Claude"
description = "Every Claude in every workspace, grouped by workspace, with its state and a live preview; Enter jumps there."
contexts = ["pane"]
command = ["bin/statetrail", "goto-open"]

[[events]]
on = "pane.agent_detected"
command = ["bin/statetrail", "auto"]

[[events]]
on = "tab.focused"
command = ["bin/statetrail", "auto"]

[[panes]]
id = "trail"
title = "statetrail"
placement = "split"
command = ["bin/statetrail", "pane"]

# 底部的自定义按钮（配置里的 [[buttons]]，默认 Git = lazygit、文件 = yazi、命令行）：轨迹把它从 Claude
# 下面切出来（占 Claude 那一格高度的 height / tool_height），除了命令行都是点外面就关。命令经 STATETRAIL_CMD 传进来。
[[panes]]
id = "tool"
title = "Tool"
placement = "split"
# 目录进不去（被删了）就在家目录里开，别让窗格一闪就没了
command = ["sh", "-c", "cd \"${STATETRAIL_CWD:-$PWD}\" 2>/dev/null || cd \"$HOME\"; exec sh -c \"$STATETRAIL_CMD\""]

[[panes]]
id = "goto"
title = "statetrail goto"
placement = "popup"
width = "95%"
height = "85%"
command = ["bin/statetrail", "goto"]
